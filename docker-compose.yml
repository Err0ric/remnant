# Default: published on 127.0.0.1 only. The app serves HTTPS inside the container
# (self-signed on first start, see docs/install/tls.md): browse to https://127.0.0.1:8080.
#
# First start prints a one-time link that creates the administrator account:
#   docker compose logs app | grep -A1 "one-time link"
# For a team VM, set APP_BIND=0.0.0.0 (or the VM's IP) in .env so analysts can reach
# it, and APP_PUBLIC_NAME to the name they type, so the link and certificate use it.

services:
  app:
    build:
      context: .
      # Shown on About: GIT_COMMIT=$(git rev-parse HEAD) docker compose up -d --build
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: app:dev
    environment:
      APP__SERVER__HOST: 0.0.0.0
      APP__PATHS__ALLOWED_ROOTS: /logs
      APP__PATHS__RULE_ROOTS: /rules
      APP__SERVER__PUBLIC_NAMES: ${APP_PUBLIC_NAME:-localhost}
      # Set only if analysts reach the app on another port or through a proxy.
      APP__SERVER__PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # Reverse proxies whose X-Forwarded-For is believed (ADR-0027). Empty: ignored.
      APP__SERVER__TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Optional single sign-on (docs/install/sso-entra.md). Off unless SSO_ENABLED=true.
      APP__SSO__ENABLED: ${SSO_ENABLED:-false}
      APP__SSO__ISSUER: ${SSO_ISSUER:-}
      APP__SSO__CLIENT_ID: ${SSO_CLIENT_ID:-}
      APP__SSO__CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      APP__SSO__LABEL: ${SSO_LABEL:-Microsoft}
      APP__SSO__REQUIRED_GROUPS: ${SSO_REQUIRED_GROUPS:-}
      APP__SSO__PASSWORD_LOGIN: ${SSO_PASSWORD_LOGIN:-admins}
      APP__SSO__EXTRA_SCOPES: ${SSO_EXTRA_SCOPES:-}
      APP__SSO__TOKEN_AUTH_METHOD: ${SSO_TOKEN_AUTH_METHOD:-auto}
      # Ask prompt version; change only after the accuracy suite shows the new one is as good.
      APP__LLM__ASK_PROMPT: ${ASK_PROMPT:-ask.v4}
      # Optional outbound proxy for the Microsoft 365 and Anthropic sources and Teams or
      # Slack alerts (docs/install/proxy.md). Unset: direct.
      APP__NETWORK__HTTPS_PROXY: ${HTTPS_PROXY_URL:-}
      APP__NETWORK__PROXY_USERNAME: ${PROXY_USERNAME:-}
      APP__NETWORK__PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      APP__NETWORK__CA_BUNDLE: ${PROXY_CA_BUNDLE:-}
    # Memory limit for the container (D80): set it in .env to fit the machine, for
    # example APP_MEM_LIMIT=3g. Unset: no container limit.
    mem_limit: ${APP_MEM_LIMIT:-0}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
      # Syslog listener sources (docs/install/syslog-listener.md): publish the ports your
      # sources use. Nothing is published by default.
      # - "${SYSLOG_BIND:-0.0.0.0}:5514:5514/udp"
      # - "${SYSLOG_BIND:-0.0.0.0}:5514:5514/tcp"
      # - "${SYSLOG_BIND:-0.0.0.0}:6514:6514/tcp"
    volumes:
      - app-data:/srv/data
      - ./config:/srv/config:ro
      - ${LOGS_DIR:-./logs}:/logs:ro
      # Sigma rule sets to import (for example a git clone of SigmaHQ/sigma), read only.
      - ${RULES_DIR:-./rules}:/rules:ro
    # rsyslog on Debian/Ubuntu writes files as group "adm" (gid 4), mode 0640.
    # Joining that group lets the app read them without running as root.
    group_add:
      - "${LOGS_GID:-4}"
    # Hardening: nothing outside /srv/data and /tmp is writable, no Linux capabilities
    # (ports are above 1024), and no way to gain privileges. Checked by release-checks.yml.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    restart: unless-stopped

  # Demo data: writes made-up logs into LOGS_DIR (24 h of history, then a live trickle).
  # docker compose --profile demo up -d
  loggen:
    profiles: ["demo"]
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    command: ["python", "/scripts/loggen.py", "--out", "/logs/demo", "--backfill", "3000", "--rate", "2"]
    volumes:
      - ./scripts:/scripts:ro
      - ${LOGS_DIR:-./logs}:/logs
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  app-data:
  ollama-models:
