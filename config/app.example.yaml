# Copy to config/app.yaml. Every key can be overridden with APP__SECTION__KEY env vars.
server:
  host: 127.0.0.1      # anything other than loopback requires auth below
  port: 8080
  # environment_label: Lab   # optional top bar label to tell installs apart; shown before sign-in
  # memory_limit_mb: 0       # memory budget queries are sized from; 0 = 75% of memory
  # address_space_cap: false  # opt-in RLIMIT_AS at the budget; enforce memory with systemd or Docker instead
  # query_threads: 0          # DuckDB threads per query; 0 = usable CPUs, at most 4
  # max_concurrent_queries: 0 # queries at once, others wait then get "busy"; 0 = 4
  # query_spill_limit_mb: 10240 # disk all queries may overflow to under data/tmp/duckdb; 0 = DuckDB's default
  # trace_queries: false        # log a query.trace line per page query (sources, files, slowest steps)
  # page_query_mb: 0            # memory a page-section query reserves before it spills; 0 = one share
  # section_parallel: 0         # Microsoft 365 fact queries a section runs at once; 0 = 4, 1 = one at a time
  # query_pool: false           # reuse one DuckDB instance per slot for page sections (footers cached); see D146

auth:
  # Set one of these to bind beyond localhost. Prefer env vars over YAML for secrets.
  # password_hash: "$argon2id$..."
  # api_token: (set via APP__AUTH__API_TOKEN instead)

paths:
  data_dir: data
  allowed_roots: []    # folders sources may read from, e.g. [/logs]
  rule_roots: []       # folders Sigma rules may be imported from, e.g. [/rules]

schedules:
  timezone: UTC        # cron times for scheduled searches and rules, e.g. America/Los_Angeles
  lag_seconds: 120     # each run ends this long before its fire time, so late events still count

# How failed Microsoft Entra sign-ins are counted (D158). The shipped classes are in
# backend/app/content/m365/signin_codes.yaml; move a code here instead of editing that file.
# Classes: failed (counted as Failed sign-ins), interrupted, expired, other.
# m365:
#   signin_classes:
#     "50074": failed   # count MFA prompts as failures, for MFA-fatigue hunting
#     "500121": failed

# A Claude Code session with no end record and nothing for this many minutes reads
# "Ended (no end event)" on Agents > Sessions (D161).
# Health flags a machine whose hooks plugin has records waiting and delivered none for
# this many days, and raises one alert for it (D166).
# agents:
#   session_idle_minutes: 120
#   queue_stuck_days: 3
