schema_version: 1
id: ssh_logins
name: SSH logins by user and source
description: >-
  sshd sign-ins per user, client address, and result, with first and last time. Reads
  the linux_sshd template's parsed columns, so it keeps working whatever the message text.
tags: [linux, ssh, identity, example]
mode: query
sql: |-
  SELECT actor_user_name AS "user", src_endpoint_ip AS client,
         CASE status_id WHEN 1 THEN 'success' WHEN 2 THEN 'failure' ELSE 'other' END AS result,
         count(*) AS attempts, min(time) AS first_seen, max(time) AS last_seen
  FROM events
  WHERE template_id = 'linux_sshd' AND class_uid = 3002
    AND time BETWEEN {{start}} AND {{end}}
  GROUP BY ALL
  ORDER BY attempts DESC
params: []
