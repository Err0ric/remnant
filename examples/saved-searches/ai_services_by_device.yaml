schema_version: 1
id: ai_services_by_device
name: AI services by device (DNS and DHCP)
description: >-
  Each AI service query from DNS, named by the device that held the client address at the
  time: the newest Palo Alto DHCP lease for that address at or before the query (an ASOF
  join, so a reused address is named correctly), looking back up to 7 days before the
  range. Devices without a lease keep their address. Adapt the lease part for other DHCP
  servers.
tags: [ai, dns, dhcp, example]
mode: query
sql: |-
  WITH ai(domain, service) AS (VALUES
    ('chatgpt.com', 'ChatGPT'), ('openai.com', 'ChatGPT'), ('api.openai.com', 'OpenAI API'),
    ('claude.ai', 'Claude'), ('api.anthropic.com', 'Anthropic API'), ('gemini.google.com', 'Gemini'),
    ('copilot.microsoft.com', 'Microsoft Copilot'), ('githubcopilot.com', 'GitHub Copilot'),
    ('perplexity.ai', 'Perplexity'), ('deepseek.com', 'DeepSeek'), ('cursor.com', 'Cursor'),
    ('bzr.openai.com', '-'), ('bzrcdn.openai.com', '-')
  ),
  q AS (
    SELECT event_id, time AS t, src_endpoint_ip AS ip, lower(rtrim(message, '.')) AS qname
    FROM events
    WHERE class_uid = 4003 AND time BETWEEN {{start}} AND {{end}}
  ),
  best AS (
    SELECT q.event_id, any_value(q.t) AS t, any_value(q.ip) AS ip,
           arg_max(ai.service, length(ai.domain)) AS service
    FROM q JOIN ai ON q.qname = ai.domain OR ends_with(q.qname, '.' || ai.domain)
    GROUP BY q.event_id
  ),
  leases AS (
    SELECT time AS t,
           regexp_extract(message, 'lease started ip ([0-9.]+)', 1) AS ip,
           regexp_extract(message, 'mac ([0-9A-Fa-f:]{17})', 1) AS mac,
           nullif(regexp_extract(message, 'hostname ([^,\s]+)', 1), '[Unavailable]') AS host
    FROM events
    WHERE template_id = 'paloalto_system'
      AND json_extract_string(unmapped, '$.subtype') = 'dhcp'
      AND time BETWEEN {{start}} - INTERVAL 7 DAY AND {{end}}
  )
  SELECT coalesce(l.host, l.mac, b.ip) AS device, b.service, count(*) AS queries,
         max(b.t) AS last_seen
  FROM best b
  ASOF LEFT JOIN (SELECT * FROM leases WHERE ip <> '') l ON b.ip = l.ip AND b.t >= l.t
  WHERE b.service <> '-'
  GROUP BY ALL
  ORDER BY queries DESC
params: []
