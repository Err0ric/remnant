schema_version: 1
id: m365_new_service_principals
name: New service principals not owned by Microsoft
description: >-
  Enterprise apps added to the tenant, leaving out the ones Microsoft provisions itself:
  actor Azure Resource Manager (a resource provider was registered) or an app owned by
  Microsoft's own tenants. What is left is someone adding a third-party or in-house app,
  which is where OAuth and app risk starts. Matches the owner on raw, so it works for
  both the Graph directory audit and the Management Activity API rows.
tags: [m365, identity, apps, example]
mode: query
sql: |-
  SELECT time, actor_user_name AS actor, src_endpoint_ip AS client, message, template_id, raw
  FROM events
  WHERE template_id IN ('m365_directory_audit', 'm365_management_activity')
    AND message IN ('Add service principal', 'Add service principal.')
    AND coalesce(actor_user_name, '') <> 'Azure Resource Manager'
    AND raw NOT LIKE '%f8cdef31-a31e-4b4a-93e4-5f571e91255a%'
    AND raw NOT LIKE '%72f988bf-86f1-41af-91ab-2d7cd011db47%'
    AND time BETWEEN {{start}} AND {{end}}
  ORDER BY time DESC
params: []
