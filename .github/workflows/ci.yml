name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same PR cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  architecture:
    if: github.event_name != 'push' || !github.event.repository.private  # private dev repo: the PR run is the gate; public minutes are free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: ./scripts/check-architecture.sh

  backend:
    if: github.event_name != 'push' || !github.event.repository.private  # private dev repo: the PR run is the gate; public minutes are free
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff format --check app tests evals
      - run: uv run ruff check app tests evals
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Known vulnerabilities in runtime packages (docs/security/dependencies.md)
        run: |
          uv export --frozen --no-dev --no-hashes -q -o /tmp/requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit -r /tmp/requirements.txt --vulnerability-service pypi \
            --ignore-vuln PYSEC-2026-2447 --ignore-vuln GHSA-w8v5-vhqr-4h9v \
            --ignore-vuln PYSEC-2026-4320
      - name: SBOM (CycloneDX, runtime packages and base images)
        run: uv run python ../scripts/sbom.py --out ../sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom
          path: sbom.cdx.json

  frontend:
    if: github.event_name != 'push' || !github.event.repository.private  # private dev repo: the PR run is the gate; public minutes are free
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          package_json_file: frontend/package.json  # pnpm version from packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in shipped packages (docs/security/dependencies.md)
        run: pnpm audit --prod
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
