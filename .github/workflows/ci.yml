name: ci

on:
  push:
    branches: [main]
  # Docs and ADRs alone never run CI (the private repo's minutes are limited). A PR that
  # also changes code still runs.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# A newer run on the same PR or branch cancels the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Private dev repo only (its minutes are limited): a PR runs the backend job only when
  # something outside frontend/ and the docs changed, and the frontend job only when
  # frontend/ changed. Scale tests never run here (`-m scale` is excluded by default; run
  # them with the scale workflow, on demand).
  # The public repo always runs everything.
  changes:
    if: github.event_name == 'pull_request' && github.event.repository.private
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          code=$(echo "$files" | grep -vE '^frontend/|^docs/|\.md$' || true)
          echo "backend=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(echo "$files" | grep -qE '^(frontend/|\.github/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  architecture:
    if: github.event_name != 'push' || !github.event.repository.private  # private dev repo: the PR run is the gate; public minutes are free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: ./scripts/check-architecture.sh

  backend:
    needs: changes
    if: >-
      always() && (github.event_name != 'push' || !github.event.repository.private)
      && (needs.changes.result == 'skipped' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff format --check app tests evals
      - run: uv run ruff check app tests evals
      - run: uv run mypy
      - run: uv run pytest -q --junitxml=/tmp/junit.xml
      - name: Name failing tests in the check (readable without the raw log)
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("/tmp/junit.xml")
          if not p.exists():
              raise SystemExit
          n = 0
          for case in ET.parse(p).iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  msg = (bad.get("message") or "").replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:900]
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
                  n += 1
                  if n >= 10:
                      raise SystemExit
          PY
      - name: Known vulnerabilities in runtime packages (docs/security/dependencies.md)
        run: |
          uv export --frozen --no-dev --no-hashes -q -o /tmp/requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit -r /tmp/requirements.txt --vulnerability-service pypi \
            --ignore-vuln PYSEC-2026-2447 --ignore-vuln GHSA-w8v5-vhqr-4h9v \
            --ignore-vuln PYSEC-2026-4320
      - name: SBOM (CycloneDX, runtime packages and base images)
        run: uv run python ../scripts/sbom.py --out ../sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom
          path: sbom.cdx.json

  frontend:
    needs: changes
    if: >-
      always() && (github.event_name != 'push' || !github.event.repository.private)
      && (needs.changes.result == 'skipped' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          package_json_file: frontend/package.json  # pnpm version from packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in shipped packages (docs/security/dependencies.md)
        # Findings fail at once; only an error from the audit service is retried (3 tries).
        run: ../scripts/pnpm-audit.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --reporter=default --reporter=github-actions  # failing tests become check annotations
      - run: pnpm build
