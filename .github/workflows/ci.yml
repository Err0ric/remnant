name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same PR cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  architecture:
    if: github.event_name != 'push' || !github.event.repository.private  # private dev repo: the PR run is the gate; public minutes are free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-architecture.sh

  backend:
    if: github.event_name != 'push' || !github.event.repository.private  # private dev repo: the PR run is the gate; public minutes are free
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff format --check app tests evals
      - run: uv run ruff check app tests evals
      - run: uv run mypy
      - run: uv run pytest -q
      - name: SBOM (CycloneDX, runtime packages and base images)
        run: uv run python ../scripts/sbom.py --out ../sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  frontend:
    if: github.event_name != 'push' || !github.event.repository.private  # private dev repo: the PR run is the gate; public minutes are free
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json  # pnpm version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
