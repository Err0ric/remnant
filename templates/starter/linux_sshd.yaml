schema_version: 1
id: linux_sshd
name: Linux sshd authentication
version: 1.0.0
author: starter-pack
description: >-
  OpenSSH server authentication events through syslog (RFC 3164 or 5424): accepted and
  failed logins, invalid users, disconnects, and PAM session open and close.
category: identity
vendor: linux
classification_default: local_only
sigma:
  logsource:
    - {product: linux}
    - {product: linux, service: auth}
    - {product: linux, service: sshd}

envelope:
  type: syslog
  syslog:
    rfc: auto
    assume_year: rollover_safe
    timezone: UTC
    strip_relay_headers: true

match:
  app_name: [sshd]
  min_confidence: 0.9

framing:
  max_len: 4096

payload:
  format: regex
  regex:
    patterns:
      - '^(?P<event>Accepted|Failed) (?P<method>\S+) for (?:(?P<invalid>invalid user) )?(?P<user>\S*) from (?P<src_ip>[\da-fA-F:.]+) port (?P<src_port>\d+)'
      - '^(?P<event>Invalid) user (?P<user>\S*) from (?P<src_ip>[\da-fA-F:.]+) port (?P<src_port>\d+)'
      - '^(?P<event>Disconnected) from (?:(?:authenticating|invalid) )?user (?P<user>\S+) (?P<src_ip>[\da-fA-F:.]+) port (?P<src_port>\d+)'
      - '^(?P<event>Received disconnect) from (?P<src_ip>[\da-fA-F:.]+) port (?P<src_port>\d+)'
      - '^Connection (?P<event>closed|reset) by (?:(?:authenticating|invalid) user (?P<user>\S+) )?(?P<src_ip>[\da-fA-F:.]+) port (?P<src_port>\d+)'
      - '^pam_unix\(sshd:session\): session (?P<event>opened|closed) for user (?P<user>[^\s(]+)'
      - '^(?P<event>error|fatal): (?P<detail>.+)'
      - '^(?P<event>Server listening) on (?P<listen_ip>\S+) port (?P<listen_port>\d+)'

transforms:
  - field: src_port
    op: to_int

mapping:
  class_uid: 3002          # Authentication
  fields:
    actor_user_name: { from: user }
    src_endpoint_ip: { from: src_ip }
    src_endpoint_port: { from: src_port }
    activity_id:
      from: event
      map: { Accepted: 1, Failed: 1, Invalid: 1, opened: 1, closed: 2, Disconnected: 2, "Received disconnect": 2, reset: 2 }
      default: 99
    status_id:
      from: event
      map: { Accepted: 1, Failed: 2, Invalid: 2, opened: 1, closed: 1, Disconnected: 1, "Received disconnect": 1, reset: 1, error: 2, fatal: 2 }
      default: 0
  severity:
    from: event
    map: { Accepted: 1, Failed: 3, Invalid: 3, error: 3, fatal: 4 }

tests:
  - name: accepted publickey 3164
    input: "Oct  9 20:41:12 bastion sshd[2231]: Accepted publickey for jordan from 10.20.1.5 port 51234 ssh2: ED25519 SHA256:abc"
    expect:
      parse_status: ok
      class_uid: 3002
      fields: { actor_user_name: jordan, src_endpoint_ip: 10.20.1.5, src_endpoint_port: 51234, status_id: 1, activity_id: 1, device_hostname: bastion, actor_process_pid: 2231 }
  - name: failed password invalid user
    input: "<38>Oct  9 20:41:15 bastion sshd[2240]: Failed password for invalid user admin from 203.0.113.9 port 40022 ssh2"
    expect:
      parse_status: ok
      fields: { actor_user_name: admin, src_endpoint_ip: 203.0.113.9, status_id: 2, severity_id: 3 }
  - name: 5424 envelope
    input: "<86>1 2026-10-09T20:41:12Z bastion sshd 2231 - - Accepted publickey for jordan from 10.20.1.5 port 51234 ssh2"
    expect:
      parse_status: ok
      fields: { device_hostname: bastion, actor_user_name: jordan, time: "2026-10-09T20:41:12+00:00" }
  - name: pam session closed
    input: "<86>Oct  9 21:02:00 bastion sshd[2231]: pam_unix(sshd:session): session closed for user jordan"
    expect:
      parse_status: ok
      fields: { actor_user_name: jordan, activity_id: 2, status_id: 1 }
  - name: connection closed by invalid user
    input: "<38>Oct  9 21:05:00 bastion sshd[3001]: Connection closed by invalid user oracle 198.51.100.4 port 51022 [preauth]"
    expect:
      parse_status: ok
      fields: { actor_user_name: oracle, src_endpoint_ip: 198.51.100.4, activity_id: 2 }
  - name: unknown sshd message keeps the envelope
    input: "<38>Oct  9 21:06:00 bastion sshd[3002]: Timeout before authentication for 198.51.100.4"
    expect:
      parse_status: envelope_only
      fields: { device_hostname: bastion, actor_process_name: sshd }
