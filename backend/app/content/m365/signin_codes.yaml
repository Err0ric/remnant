# How a failed Microsoft Entra sign-in is counted, by its error code (status.errorCode).
# Owner decision 2026-11-02 (D158). Entra's own sign-in logs keep interactive and
# non-interactive sign-ins apart and show "Interrupted" as a status of its own; these classes
# follow that, so a background token refresh or an MFA prompt the person then completed is
# not counted as a failure.
#
#   failed       a real failure: counted as "Failed sign-ins"
#   interrupted  the sign-in stopped for a step the person then took (MFA, stay signed in,
#                consent, a new password method); Entra shows these as Interrupted
#   expired      an expired or revoked session or token refreshed in the background
#   (any other code)  "other": counted apart, never hidden
#
# 53003 (blocked by Conditional Access) is a real failure and is also shown on its own as
# "Blocked by policy".
#
# To change a code on one install, do not edit this file: set
# `m365.signin_classes` in config/app.yaml (for example `"50074": failed` to count MFA
# interrupts as failures when hunting MFA fatigue). Every class stays visible and filterable.
classes:
  failed:
    50126: Invalid username or password
    50053: Account locked (too many attempts, or sign-in from a blocked address)
    500121: Strong authentication failed or was denied
    50055: Password expired
    50057: Account disabled
    50034: User not found in the directory
    53003: Blocked by Conditional Access
  interrupted:
    50140: Keep me signed in prompt
    50074: Strong authentication required
    50076: Strong authentication required (location or policy)
    50079: Must register for strong authentication
    50072: Must enroll a second factor
    50097: Device authentication required
    50125: Password reset or registration interrupted
    50158: External security challenge not yet satisfied
    50199: Security confirmation for a mobile or desktop app
    16000: Choose an account (several signed in)
    16001: Account selection required
    65001: User or administrator has not consented
  expired:
    50058: No session or session expired (silent sign-in)
    50132: Session revoked (password changed or reset)
    50133: Session invalid after a password change
    50173: Grant expired (password or security info changed)
    70008: Refresh token or authorization code expired
    70043: Refresh token expired by Conditional Access sign-in frequency
    70044: Session expired by Conditional Access sign-in frequency
    700082: Refresh token expired from inactivity
    81010: "Seamless SSO: ticket expired or invalid"
    81012: "Seamless SSO: signed-in user does not match"
