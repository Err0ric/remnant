# AI service catalog (ADR-0015 row 1). A destination host matches a service when it equals
# one of its domains or ends with "." plus the domain; the longest matching domain wins, so
# api.openai.com is "OpenAI API", not ChatGPT. Admins add their own entries and mark any
# service Approved or Not approved in the app; everything starts Unreviewed.
# kind: chat | api | coding | agent_platform | mcp_registry | image | meetings | writing |
#   non_usage (vendor hosts that other websites load, such as ad and measurement tags: they
#   win over the vendor's broader domain by being longer, are shown apart, and never count
#   as AI use, alerts, or flow)
- {id: chatgpt, name: ChatGPT, vendor: OpenAI, kind: chat, domains: [chatgpt.com, chat.openai.com, oaiusercontent.com, openai.com]}
- {id: openai_api, name: OpenAI API, vendor: OpenAI, kind: api, domains: [api.openai.com]}
