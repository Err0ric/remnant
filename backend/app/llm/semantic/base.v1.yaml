# Vocabulary that maps analyst language to OCSF columns (SPEC 5.7).
# Each predicate is checked by the query guard at startup. Templates can add terms later.
# Class and status ids follow OCSF 1.3.0. Predicates only match events whose template
# maps these fields; generic JSON, CSV, and headerless syslog may need message or raw.
schema_version: 1
terms:
  - term: failed login
    aliases: [failed logon, failed sign-in, authentication failure, failed auth, bad password]
    sql: "class_uid = 3002 AND status_id = 2"
    note: OCSF Authentication events with status Failure
  - term: successful login
    aliases: [successful logon, sign-in, logged in, accepted login]
    sql: "class_uid = 3002 AND activity_id = 1 AND status_id = 1"
    note: OCSF Authentication logon (activity 1) with status Success; logoffs also succeed, so the activity matters
  - term: logout
    aliases: [logoff, sign-out]
    sql: "class_uid = 3002 AND activity_id = 2"
  - term: authentication event
    aliases: [auth event, login attempt, logon attempt]
    sql: "class_uid = 3002"
  - term: account change
    aliases: [user created, user deleted, password change, group membership change]
    sql: "class_uid = 3001"
    note: OCSF Account Change
  - term: network connection
    aliases: [network traffic, firewall traffic, connection]
    sql: "class_uid = 4001"
    note: OCSF Network Activity
  - term: encoded powershell
    aliases: [encoded command, powershell -enc, base64 powershell, obfuscated powershell]
    sql: "lower(actor_process_name) = 'powershell.exe' AND (message ILIKE '%-enc%' OR message ILIKE '%-encodedcommand%')"
    note: PowerShell launched with an encoded command line
  - term: blocked connection
    aliases: [denied connection, dropped connection, blocked by the firewall, firewall block]
    sql: "class_uid = 4001 AND status_id = 2"
    note: Network Activity the device refused
  - term: allowed connection
    aliases: [permitted connection, accepted connection, allowed by the firewall]
    sql: "class_uid = 4001 AND status_id = 1"
  - term: invalid username
    aliases: [invalid user, unknown user, nonexistent account]
    sql: "class_uid = 3002 AND message ILIKE '%invalid user%'"
    note: sshd names the account it rejected; actor_user_name still holds the name tried
  - term: dns query
    aliases: [dns lookup, dns request, name resolution]
    sql: "class_uid = 4003"
    note: OCSF DNS Activity
  - term: process started
    aliases: [process launch, process creation, executed]
    sql: "class_uid = 1007 AND activity_id = 1"
    note: OCSF Process Activity, Launch
  - term: identity and access event
    aliases: [iam event]
    sql: "category_uid = 3"
  - term: network event
    aliases: [network category]
    sql: "category_uid = 4"
  - term: high severity
    aliases: [high or above, severe, important]
    sql: "severity_id >= 4"
    note: "OCSF severity: 1 informational, 2 low, 3 medium, 4 high, 5 critical, 6 fatal"
  - term: critical
    aliases: [critical severity]
    sql: "severity_id >= 5"
  - term: failed event
    aliases: [failure, failed, unsuccessful]
    sql: "status_id = 2"
  - term: external source ip
    aliases: [external ip, public ip, internet ip, from the internet]
    sql: >-
      src_endpoint_ip IS NOT NULL
      AND NOT regexp_matches(src_endpoint_ip,
      '^(10\.|127\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.|::1$|f[cd]|fe80:)')
    note: Not RFC 1918, loopback, link-local, or IPv6 local
  - term: internal source ip
    aliases: [internal ip, private ip, lan ip]
    sql: >-
      regexp_matches(src_endpoint_ip,
      '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)')
  - term: unparsed
    aliases: [could not parse, parse failure, raw only]
    sql: "parse_status IN ('envelope_only', 'failed')"
    note: Only the raw line and envelope fields are available for these events
  - term: ssh
    aliases: [sshd, secure shell]
    sql: "actor_process_name = 'sshd'"
  - term: sudo
    aliases: [privilege escalation via sudo, sudo command]
    sql: "actor_process_name = 'sudo'"
  - term: event time
    aliases: [when it happened, timestamp]
    sql: "coalesce(time, time_observed) IS NOT NULL"
    note: Use coalesce(time, time_observed) for ordering and time buckets
  - term: app consent
    aliases: [consent grant, consented to an app, oauth consent, app permission grant, consent to application]
    sql: "message ILIKE 'Consent to application%'"
    note: "Microsoft 365. Graph and the Management API both report each consent with the same metadata_correlation_uid: count DISTINCT metadata_correlation_uid, never rows. resource_name is the app (may be NULL), resource_uid its id, privileges the permissions asked for, status_detail why it failed"
  - term: blocked consent
    aliases: [failed consent, denied consent, consent attempt blocked]
    sql: "message ILIKE 'Consent to application%' AND status_id = 2"
  - term: granted consent
    aliases: [successful consent, approved consent]
    sql: "message ILIKE 'Consent to application%' AND status_id = 1"
  - term: claude code event
    aliases: [claude code, coding agent, ai agent, agent activity, cowork, hooks plugin]
    sql: "(template_id = 'claude_hooks' AND NOT (coalesce(json_extract_string(unmapped, '$.attr.test_record'), '') = 'true' AND nullif(trim(actor_user_name), '') IS NULL AND nullif(trim(device_hostname), '') IS NULL))"
    note: "Claude Code and Cowork hooks. actor_user_name is the person, device_hostname the machine, message the step (claude_hooks.pre_tool_use and so on). Details: json_extract_string(unmapped, '$.attr.<name>') for session_id, tool_name, path, program, web_host, mcp_server_name, claude_account_email"
  - term: agent tool call
    aliases: [tool call, tool use, claude code tool, agent tool]
    sql: "(template_id = 'claude_hooks' AND NOT (coalesce(json_extract_string(unmapped, '$.attr.test_record'), '') = 'true' AND nullif(trim(actor_user_name), '') IS NULL AND nullif(trim(device_hostname), '') IS NULL)) AND message = 'claude_hooks.pre_tool_use' AND lower(coalesce(json_extract_string(unmapped, '$.attr.tool_name'), '')) NOT IN ('subagenthandback')"
    note: "One row per call; the tool is json_extract_string(unmapped, '$.attr.tool_name'). SubagentHandback is Claude Code bookkeeping, never a tool. Results are post_tool_use (success) and post_tool_use_failure"
  - term: agent file write
    aliases: [file edited by the agent, files written, files changed by claude code]
    sql: "(template_id = 'claude_hooks' AND NOT (coalesce(json_extract_string(unmapped, '$.attr.test_record'), '') = 'true' AND nullif(trim(actor_user_name), '') IS NULL AND nullif(trim(device_hostname), '') IS NULL)) AND message = 'claude_hooks.pre_tool_use' AND json_extract_string(unmapped, '$.attr.tool_name') IN ('Write', 'Edit', 'MultiEdit', 'NotebookEdit')"
    note: "The target is json_extract_string(unmapped, '$.attr.path')"
  - term: agent shell command
    aliases: [command run by the agent, bash command, claude code command]
    sql: "(template_id = 'claude_hooks' AND NOT (coalesce(json_extract_string(unmapped, '$.attr.test_record'), '') = 'true' AND nullif(trim(actor_user_name), '') IS NULL AND nullif(trim(device_hostname), '') IS NULL)) AND message = 'claude_hooks.pre_tool_use' AND json_extract_string(unmapped, '$.attr.program') IS NOT NULL"
    note: "json_extract_string(unmapped, '$.attr.program') is the first word of the command only; the rest is never kept"
  - term: agent web access
    aliases: [web fetch, web search, domains fetched by the agent]
    sql: "(template_id = 'claude_hooks' AND NOT (coalesce(json_extract_string(unmapped, '$.attr.test_record'), '') = 'true' AND nullif(trim(actor_user_name), '') IS NULL AND nullif(trim(device_hostname), '') IS NULL)) AND message = 'claude_hooks.pre_tool_use' AND json_extract_string(unmapped, '$.attr.web_host') IS NOT NULL"
    note: "json_extract_string(unmapped, '$.attr.web_host') is the host only"
  - term: agent mcp call
    aliases: [mcp tool call, mcp server use]
    sql: "(template_id = 'claude_hooks' AND NOT (coalesce(json_extract_string(unmapped, '$.attr.test_record'), '') = 'true' AND nullif(trim(actor_user_name), '') IS NULL AND nullif(trim(device_hostname), '') IS NULL)) AND message = 'claude_hooks.pre_tool_use' AND json_extract_string(unmapped, '$.attr.mcp_server_name') IS NOT NULL"
    note: "Server in $.attr.mcp_server_name, tool in $.attr.mcp_tool_name"
  - term: claude account
    aliases: [claude account email, signed-in claude account, account status]
    sql: "(template_id = 'claude_hooks' AND NOT (coalesce(json_extract_string(unmapped, '$.attr.test_record'), '') = 'true' AND nullif(trim(actor_user_name), '') IS NULL AND nullif(trim(device_hostname), '') IS NULL)) AND json_extract_string(unmapped, '$.attr.claude_account_email') IS NOT NULL"
    note: "The signed-in Claude account reported by the device ($.attr.claude_account_email; $.attr.account_from says where it was read). No email means an API key session or an older plugin. Whether it is a company account is decided on the Accounts page, not here"
